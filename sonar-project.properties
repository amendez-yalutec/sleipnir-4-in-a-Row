# SonarQube Cloud. La organización y la clave del proyecto llegan desde el CI
# (variables del repo SONAR_ORGANIZATION y SONAR_PROJECT_KEY); ver README § Calidad automática.
sonar.projectName=Cuatro en línea 8×7 — Equipo 6
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.inclusions=packages/*/src/**,apps/*/src/**,tools/*/src/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx

sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/cli.ts,**/main.ts,**/search-worker.ts
